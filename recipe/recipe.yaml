schema_version: 1

context:
  name: python-socks
  version: "3.1.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 8d3e817cdbe858dc0bb8c8fdc8e79b6ce37acce110d33374c6f57a675cc9029e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=77.0
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - python_socks
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Core proxy (SOCKS4, SOCKS5, HTTP tunneling) functionality for Python
  license: Apache-2.0
  license_file:
    - LICENSE.txt
  homepage: https://github.com/romis2012/python-socks

extra:
  recipe-maintainers:
    - thewchan
